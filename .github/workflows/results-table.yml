name: Rebuild the results table
on:
  push:
    branches: [main]
    paths: ["pairs/**/results.json", "baselines/scores.json", "build_table.py"]
permissions:
  contents: write
jobs:
  table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: python build_table.py
      - run: |
          git config user.name "results-table"
          git config user.email "actions@users.noreply.github.com"
          git add RESULTS.md
          git diff --cached --quiet || (git commit -m "Rebuild the results table" && git push)
